      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /social-automation/api/action-registry/tags/{id}/accounts/{accountId}:
    delete:
