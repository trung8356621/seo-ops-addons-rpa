  /social-automation/api/script-registry:
    get:
      tags: [Staff Session]
      summary: List published scripts for React Script Registry
      description: |
        Staff Session GET only. Reuses ScriptRegistryUiService::listScriptsForUi.
        Identity fields: package_key (stable package identity) and script_id (manifest script_id, may differ).
        Media fields are IDs + Staff session URLs under /social-automation/script-media/{id}; no filesystem paths.
      operationId: staffScriptRegistryIndex
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Script list (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffScriptRegistryListResponse'
        '401':
          description: Unauthenticated (Staff Session required)
        '403':
          description: Authenticated but not allowed for Social Automation

  /social-automation/api/script-registry/{id}:
    get:
      tags: [Staff Session]
      summary: Script detail by package_key
      description: |
        Path `{id}` is the package_key (not numeric DB id, not necessarily equal to script_id).
        Releases are capped and sanitized (media IDs/URLs only; no asset storage paths).
      operationId: staffScriptRegistryShow
      security:
        - SeoOpsSessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: package_key
          schema:
            type: string
            minLength: 1
            maxLength: 191
      responses:
        '200':
          description: Script detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffScriptRegistryDetailResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Script package not found

  /social-automation/api/client-keys:
    get:
      tags: [Staff Session]
      summary: List client API keys
      operationId: clientKeysIndex
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkTrue'
                  - type: object
                    properties:
                      keys:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
    post:
      tags: [Staff Session]
      summary: Create client API key (raw key returned once)
      operationId: clientKeysStore
      security:
        - SeoOpsSessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  raw_key:
                    type: string
                    example: CLIENT_KEY_PLACEHOLDER
                  key:
                    type: object
                    additionalProperties: true

  /social-automation/api/client-keys/active-or-candidate:
    get:
      tags: [Staff Session]
      summary: Active or candidate key state for UI
      operationId: clientKeysActiveOrCandidate
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  endpoint:
                    type: string
                  data:
                    type: object
                    additionalProperties: true

  /social-automation/api/client-keys/activate-candidate:
    post:
      tags: [Staff Session]
      summary: Activate candidate client API key
      operationId: clientKeysActivateCandidate
      security:
        - SeoOpsSessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [candidate_token]
              properties:
                candidate_token:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/ValidationError'

  /social-automation/api/client-keys/{id}/revoke:
    post:
      tags: [Staff Session]
      summary: Revoke client API key by id
      operationId: clientKeysRevoke
      security:
        - SeoOpsSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /social-automation/api/staff/client-connection:
    get:
      tags: [Staff Session]
      summary: Staff Client connection state (or temporary bootstrap Key)
      description: |
        Authenticated Staff only (session user id). When not connected, returns a fresh bootstrap Key
        for localStorage (`localstorage_key` = `sa_staff_client_bootstrap_v1`) plus tutorial placeholder.
        Unused Keys are not persisted. When connected, returns this Staff's machine only.
      operationId: staffClientConnectionShow
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Connection state or bootstrap Key
          content:
            application/json:
              schema:
                type: object
                required: [ok, connected, status, localstorage_key]
                properties:
                  ok:
                    type: boolean
                  connected:
                    type: boolean
                  status:
                    type: string
                    enum: [connected, not_connected]
                  bootstrap:
                    type: object
                    nullable: true
                    additionalProperties: true
                  connection:
                    type: object
                    nullable: true
                    additionalProperties: true
                  localstorage_key:
                    type: string
                    example: sa_staff_client_bootstrap_v1
                  endpoint:
                    type: string
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /social-automation/api/staff/client-connection/bootstrap-key:
    post:
      tags: [Staff Session]
      summary: Re-issue temporary Staff bootstrap Key
      description: |
        Refresh/reuse contract: issues a new signed bootstrap Key; previous unused Keys remain
        valid until their own expiry but are not tracked server-side. Rejects if Staff already connected.
      operationId: staffClientConnectionBootstrapKey
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Bootstrap Key issued (zero DB writes)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: Staff already connected
        '403':
          description: Forbidden

  /social-automation/api/staff/client-connection/disconnect:
    post:
      tags: [Staff Session]
      summary: Disconnect this Staff's Client without Electron cooperation
      description: |
        Revokes the Staff's active Client API Key and force-releases the connection lease.
        Works when Electron is offline/uninstalled. Preserves successful connection history.
      operationId: staffClientConnectionDisconnect
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No active connection
        '403':
          description: Forbidden

  /social-automation/api/owner/client-connections:
    get:
      tags: [Staff Session]
      summary: Owner inventory of successful Client connections
      description: |
        Owner/Admin only. Lists connected/disconnected Clients with responsible Staff,
        key prefix, machine name, status, connected_at, disconnected_at, last_heartbeat.
        Unused temporary Keys are never stored and never listed.
      operationId: ownerClientConnectionsIndex
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Successful connection inventory
          content:
            application/json:
              schema:
                type: object
                required: [ok, connections, summary]
                properties:
                  ok:
                    type: boolean
                  connections:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  summary:
                    type: object
                    additionalProperties: true
                  notes:
                    type: string
        '403':
          description: Forbidden (Staff cannot access)

  /social-automation/api/browsers:
    get:
      tags: [Staff Session]
      summary: Browser-first inventory for staff Clients UI (read-only)
      description: |
        Flattened Browser rows (primary identity = browser_id / session_uuid).
        Client/PC fields are metadata only (client_api_key_id, machine_name).
        Online policy reuses OnlineStateCalculator agent heartbeat TTL.
        Device offline → runtime_status=unknown_stale and is_online=null (not invented offline).
        Never returns raw Client API keys, passwords, cookies, connection tokens, or filesystem paths.
      operationId: staffBrowsersIndex
      security:
        - SeoOpsSessionCookie: []
      responses:
        '200':
          description: Browser inventory snapshot
          content:
            application/json:
              schema:
                type: object
                required: [ok, browsers, summary, status_policy]
                properties:
                  ok:
                    type: boolean
                  browsers:
                    type: array
                    items:
                      type: object
                      required: [browser_id, runtime_status, is_online]
                      properties:
                        browser_id:
                          type: string
                        browser_name:
                          type: string
                        browser_label:
                          type: string
                        username:
                          type: string
                          nullable: true
                        account_name:
                          type: string
                          nullable: true
                        account_id:
                          type: integer
                          nullable: true
                        account_uuid:
                          type: string
                          nullable: true
                        platform:
                          type: string
                        site_url:
                          type: string
                          nullable: true
                        client_id:
                          type: integer
                          nullable: true
                          description: Logical Client = client_api_key_id
                        client_api_key_id:
                          type: integer
                          nullable: true
                        machine_name:
                          type: string
                          nullable: true
                        device_id:
                          type: string
                          nullable: true
                        runtime_status:
                          type: string
                          enum: [running, stopped, error, crashed, unknown_stale]
                        reported_status:
                          type: string
                        is_online:
                          type: boolean
                          nullable: true
                        device_online:
                          type: boolean
                        last_seen_at:
                          type: string
                          nullable: true
                          format: date-time
                        device_heartbeat_at:
                          type: string
                          nullable: true
                          format: date-time
                        session_state:
                          type: string
                        signal_status:
                          type: string
                        last_task_at:
                          type: string
                          nullable: true
                          format: date-time
                  summary:
                    type: object
                    required: [total_browsers, online_browsers, offline_browsers, total_clients]
                    properties:
                      total_browsers:
                        type: integer
                      online_browsers:
                        type: integer
                        description: Count of browsers with is_online=true
                      offline_browsers:
                        type: integer
                        description: Count of browsers with is_online=false (excludes unknown/null)
                      total_clients:
                        type: integer
                        description: Distinct non-null client_api_key_id in the same browser list
                  status_policy:
                    type: object
                    required: [source, heartbeat_ttl_seconds]
                    properties:
                      source:
                        type: string
                        enum: [backend]
                      heartbeat_ttl_seconds:
                        type: integer
                      notes:
                        type: string
        '401':
          description: Unauthenticated staff session
        '403':
          description: Authenticated but not allowed to access Social Automation

