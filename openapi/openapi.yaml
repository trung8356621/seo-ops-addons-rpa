openapi: 3.0.3
info:
  title: Social Automation API
  version: 0.2.0
  description: |
    HTTP API for the Social Automation addon (RPA control plane, package registry, clients, runners, staff UI).

    **Error envelopes**
    - Most business endpoints return `{ "ok": false, "errors": ["code"] }` with stable HTTP status (401/403/404/409/422/503).
    - Some RPA Client responses also include a top-level `"error"` string alongside `errors`.
    - Core Service API middleware may return `{ "error": { "code", "message" } }` (no `ok` field).

    **Client API key lease**
    - One active connection per client API key; default lease TTL **120 seconds**.
    - `register` / `heartbeat` return `connection_token` and `connection_lease_expires_at`; send `connection_token` on reconnect and on `disconnect`.
    - Another holder with a valid lease → HTTP **409** with `CLIENT_KEY_IN_USE`.

    **Staff Client enrollment (CP17A)**
    - Staff Session issues a **stateless bootstrap Key** (no DB row until Electron successfully registers).
    - Browser may cache bootstrap in `localStorage` under key `sa_staff_client_bootstrap_v1` (`raw_key`, `expires_at`, `key_prefix`, `installation_id`).
    - Bootstrap Bearer authorizes **POST /client/register only**; it does not grant heartbeat, browser-sync, accounts, or auth pull.
    - Successful register materializes `sa_client_api_keys` with `created_by` = Staff user id and issues the normal connection lease.
    - Enforcement: **1 Staff = 1 active Client** (one non-revoked key per `created_by` per installation).
    - Staff Disconnect revokes the key and force-releases the lease **without requiring Electron**; history rows are preserved (`revoked_at` = disconnected_at).
    - Owner inventory lists successful connections only (keys with a client agent); unused bootstraps never appear.

    **Service API**
    - Base path `/api/v1/services/{service}/social-automation/...`
    - Path parameter `{service}` must be public slug `social-automation`.
    - Auth Bearer `svc_live_...` from `service_api_credentials` with documented scopes (never OPS `service_key`).

servers:
  - url: /
    description: SEO-OPS host

tags:
  - name: Docs
    description: Swagger UI and machine-readable OpenAPI (SEO-OPS session or RPA Admin Bearer)
  - name: RPA Admin
    description: RPA Admin user auth and script registry sync (admin|owner SEO-OPS users)
  - name: RPA Client
    description: Electron / RPA Client (Bearer client API key)
  - name: Service API Admin
    description: Package registry, tasks, schedules, compose, manual dispatch (service_api_credentials)
  - name: Service API Runner
    description: Runner agent, session sync, job lifecycle (service_api_credentials)
  - name: Staff Session
    description: Filament browser session (cookie) for SEO-OPS staff UI helpers

security: []

components:
  securitySchemes:
    SeoOpsSessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Browser session after Filament login on SEO-OPS. CSRF may apply on mutating staff routes.
        Used for docs, bootstrap/health, action-registry, client-keys, accounts, browsers inventory, client notifications.
    RpaAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque token from `POST /api/v1/social-automation/rpa-admin/login` (SEO-OPS user role admin or owner).
        Alternative header `X-Rpa-Admin-Token` is accepted by the server but prefer Authorization Bearer.
    RpaClientApiKey:
      type: http
      scheme: bearer
      bearerFormat: client_api_key
      description: |
        Persisted RPA Client API key, or a staff enrollment bootstrap Key on POST /client/register only.
        Bootstrap Keys are HMAC-signed, staff+installation scoped, and expire; they are not stored until successful registration.
    ServiceApiBearer:
      type: http
      scheme: bearer
      bearerFormat: svc_live
      description: Core `service_api_credentials` token (e.g. `svc_live_...`) with Social Automation scopes.

  parameters:
    ServiceSlug:
      name: service
      in: path
      required: true
      schema:
        type: string
        enum: [social-automation]
      description: Public catalog slug; must resolve to `social-automation`.
    PackageKey:
      name: packageKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    AgentUuid:
      name: agentUuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]+$'
    JobUuid:
      name: jobUuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]+$'
    BrowserId:
      name: browserId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScriptRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]+$'
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    OkTrue:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    StaffScriptRegistryListItem:
      type: object
      required:
        - package_key
        - script_id
        - name
        - version
        - status
        - is_authentication
        - assets_complete
        - video_demo_status
      properties:
        package_key:
          type: string
        script_id:
          type: string
          description: Manifest script_id; may differ from package_key
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        release_id:
          type: integer
        status:
          type: string
        is_authentication:
          type: boolean
        action_tag_key:
          type: string
          nullable: true
        assets_complete:
          type: boolean
        video_demo_status:
          type: string
        has_playable_video:
          type: boolean
        has_thumbnail:
          type: boolean
        video_media_id:
          type: integer
          nullable: true
        thumbnail_media_id:
          type: integer
          nullable: true
        video_media_url:
          type: string
          nullable: true
          description: Staff Session URL (/social-automation/script-media/{id})
        thumbnail_media_url:
          type: string
          nullable: true
        published_at:
          type: string
          nullable: true
        updated_by_label:
          type: string
        widget_dependency_count:
          type: integer

    StaffScriptRegistryListResponse:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          required: [scripts, count]
          properties:
            scripts:
              type: array
              items:
                $ref: '#/components/schemas/StaffScriptRegistryListItem'
            count:
              type: integer

    StaffScriptRegistryDetailResponse:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          required: [script]
          properties:
            script:
              type: object
              additionalProperties: true
              properties:
                package_key:
                  type: string
                script_id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                is_authentication:
                  type: boolean
                version:
                  type: string
                status:
                  type: string
                assets_complete:
                  type: boolean
                video_demo_status:
                  type: string
                video_media_id:
                  type: integer
                  nullable: true
                thumbnail_media_id:
                  type: integer
                  nullable: true
                video_media_url:
                  type: string
                  nullable: true
                thumbnail_media_url:
                  type: string
                  nullable: true
                releases:
                  type: array
                  maxItems: 25
                  items:
                    type: object
                    additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [ok, errors]
      properties:
        ok:
          type: boolean
          enum: [false]
        errors:
          type: array
          items:
            type: string
          example: [unauthorized]

    ClientErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              type: string
              description: Primary error code (may duplicate errors[0]).
            message:
              type: string
              nullable: true
            diagnostic:
              type: string
              nullable: true

    ClientAuthScriptRequest:
      type: object
      required: [connection_token, account_id]
      properties:
        connection_token:
          type: string
          description: Active Client connection lease token
        account_id:
          type: string
          description: Account UUID or numeric id (installation-scoped)
        action_tag_id:
          type: integer
        action_tag_key:
          type: string
          description: Explicit Tag context (required if action_tag_id omitted)

    ClientAuthScriptRelease:
      type: object
      properties:
        action_tag_id:
          type: integer
        action_tag_key:
          type: string
        package_key:
          type: string
        package_id:
          type: integer
        kind:
          type: string
          enum: [script]
        is_authentication:
          type: boolean
          enum: [true]
        version:
          type: string
        release_id:
          type: integer
        content_digest:
          type: string
        schema_version:
          type: integer
        status:
          type: string
          enum: [published]
        runtime_compatibility:
          type: object
          additionalProperties: true
          nullable: true
        assets_complete:
          type: boolean
        ready_to_execute:
          type: boolean
        manifest:
          type: object
          additionalProperties: true
          description: Present on pull only

    ClientAuthScriptResolveSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            release:
              $ref: '#/components/schemas/ClientAuthScriptRelease'

    ClientAuthScriptPullSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            release:
              allOf:
                - $ref: '#/components/schemas/ClientAuthScriptRelease'
                - type: object
                  required: [manifest]
                  properties:
                    manifest:
                      type: object
                      additionalProperties: true

    ServiceApiCoreError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: unauthorized
            message:
              type: string
              example: Authentication required.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: email@example.com
        password:
          type: string
          format: password
          example: secret
        client_label:
          type: string
          maxLength: 128
          description: Optional label stored on the admin session row.

    RpaAdminLoginSuccess:
      type: object
      required: [ok, token, expires_at, user]
      properties:
        ok:
          type: boolean
          enum: [true]
        token:
          type: string
          example: TOKEN
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/RpaAdminUserPublic'

    RpaAdminUserPublic:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string

    RpaAdminSessionSuccess:
      type: object
      required: [ok, user, expires_at]
      properties:
        ok:
          type: boolean
          enum: [true]
        user:
          $ref: '#/components/schemas/RpaAdminUserPublic'
        expires_at:
          type: string
          format: date-time

    ClientValidateSuccess:
      type: object
      required: [ok, client_api_key, installation]
      properties:
        ok:
          type: boolean
          enum: [true]
        client_api_key:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            key_prefix:
              type: string
            installation_id:
              type: string
            last_used_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
              nullable: true
        installation:
          type: object
          properties:
            installation_id:
              type: string

    ClientRegisterRequest:
      type: object
      properties:
        display_name:
          type: string
        app_version:
          type: string
        runtime_version:
          type: string
        max_concurrency:
          type: integer
          minimum: 1
        capabilities:
          type: array
          items:
            type: string
        connection_token:
          type: string
          description: Omit on first connect; send when reclaiming lease after expiry or same session.
        device_id:
          type: string
          description: Ignored on register — identity is the API key.

    ClientRegisterSuccess:
      type: object
      required: [ok, agent, connection_token, connection_lease_expires_at]
      properties:
        ok:
          type: boolean
          enum: [true]
        agent:
          $ref: '#/components/schemas/ClientAgentSummary'
        connection_token:
          type: string
          example: CONNECTION_TOKEN_HEX
        connection_lease_expires_at:
          type: string
          format: date-time
          description: Lease TTL defaults to 120 seconds from issue/refresh.

    ClientKeyInUseError:
      allOf:
        - $ref: '#/components/schemas/ClientErrorEnvelope'
        - type: object
          properties:
            error:
              type: string
              enum: [CLIENT_KEY_IN_USE]
            errors:
              type: array
              items:
                type: string
              example: [CLIENT_KEY_IN_USE]
            message:
              type: string
              example: Client API Key is already in use by another active connection.

    ClientAgentSummary:
      type: object
      properties:
        agent_uuid:
          type: string
          format: uuid
        installation_id:
          type: string
        agent_kind:
          type: string
        display_name:
          type: string
          nullable: true
        availability:
          type: string

    DisconnectRequest:
      type: object
      required: [connection_token]
      properties:
        connection_token:
          type: string

    DisconnectSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            released:
              type: boolean

    HeartbeatRequest:
      type: object
      properties:
        connection_token:
          type: string
        agent_uuid:
          type: string
          description: Optional fallback if register link lag.

    HeartbeatSuccess:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        agent:
          $ref: '#/components/schemas/ClientAgentSummary'
        connection_token:
          type: string
        connection_lease_expires_at:
          type: string
          format: date-time
        session_signals:
          type: array
          items:
            type: object
            additionalProperties: true

    BrowserSyncRequest:
      type: object
      properties:
        browsers:
          type: array
          items:
            $ref: '#/components/schemas/BrowserProfileInput'
      description: Alternatively a single browser object with browser_id at top level.

    BrowserProfileInput:
      type: object
      properties:
        browser_id:
          type: string
        platform:
          type: string
        browser_status:
          type: string
      additionalProperties: true
      description: Cookies, passwords, and secrets are rejected.

    BrowserDeleteRequest:
      type: object
      properties:
        browser_id:
          type: string

    BrowserSessionsSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            browsers:
              type: array
              items:
                type: object
                properties:
                  browser_id:
                    type: string
                  account_name:
                    type: string
                    nullable: true
                  platform:
                    type: string
                  status:
                    type: string
                  last_confirmed_at:
                    type: string
                    format: date-time
                    nullable: true

    BindableAccount:
      type: object
      properties:
        account_id:
          type: string
        platform:
          type: string
        display_name:
          type: string
        username:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        site_url:
          type: string
          nullable: true
        has_password:
          type: boolean
        identity_label:
          type: string
          nullable: true
        verified:
          type: boolean

    AccountDetailSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            account:
              type: object
              properties:
                account_id:
                  type: string
                platform:
                  type: string
                display_name:
                  type: string
                email:
                  type: string
                  nullable: true
                site_url:
                  type: string
                  nullable: true
                password_status:
                  type: string
                  enum: [available, not_set]

    AccountPasswordSuccess:
      allOf:
        - $ref: '#/components/schemas/OkTrue'
        - type: object
          properties:
            password:
              type: string
              format: password

    SessionConfirmLoginRequest:
      type: object
      required: [browser_id, account_id, checked_at]
      properties:
        browser_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time

    PackagePublishRequest:
      type: object
      required: [package_key, kind, name, version, schema_version, manifest]
      properties:
        package_key:
          type: string
        kind:
          type: string
          enum: [script, widget, workflow]
        name:
          type: string
        version:
          type: string
        schema_version:
          type: integer
          minimum: 1
        description:
          type: string
        manifest:
          type: object
          additionalProperties: true
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: true
        runtime_compatibility:
          type: object
          properties:
            runner_min:
              type: string

    RunnerRegisterRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
        display_name:
          type: string
        app_version:
          type: string
        runtime_version:
          type: string
        max_concurrency:
          type: integer
        capabilities:
          type: array
          items:
            type: string

    JobAttemptBody:
      type: object
      required: [attempt_uuid]
      properties:
        attempt_uuid:
          type: string
          format: uuid
      additionalProperties: true

    ScriptSyncPlanRequest:
      type: object
      required: [local_scripts]
      properties:
        local_scripts:
          type: array
          items:
            type: object
            properties:
              script_id:
                type: string
              package_key:
                type: string
              version:
                type: string
              content_digest:
                type: string
              execution_digest:
                type: string
                nullable: true
              lineage:
                type: array
                items:
                  type: object
                  additionalProperties: true
              assets_complete:
                type: boolean

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/ServiceApiCoreError'
              - $ref: '#/components/schemas/ClientErrorEnvelope'
    Forbidden:
      description: Forbidden (role, scope, installation, or agent mismatch)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/ServiceApiCoreError'
              - $ref: '#/components/schemas/ClientErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/ServiceApiCoreError'
              - $ref: '#/components/schemas/ClientErrorEnvelope'
    Conflict:
      description: Conflict (digest, lease, fence, locks)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/ClientKeyInUseError'
    ValidationError:
      description: Validation or missing required fields
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/ClientErrorEnvelope'
    ServiceUnavailable:
      description: Schema or dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

paths:
  /api/v1/social-automation/docs:
    get:
      tags: [Docs]
      summary: Swagger UI HTML
      operationId: docsUi
      security:
        - SeoOpsSessionCookie: []
        - RpaAdminBearer: []
      responses:
        '200':
          description: Swagger UI page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/social-automation/openapi.yaml:
    get:
      tags: [Docs]
      summary: OpenAPI specification (YAML)
      operationId: openApiYaml
      security:
        - SeoOpsSessionCookie: []
        - RpaAdminBearer: []
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Spec file missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/social-automation/openapi.json:
    get:
      tags: [Docs]
      summary: OpenAPI specification (JSON)
      operationId: openApiJson
      security:
        - SeoOpsSessionCookie: []
        - RpaAdminBearer: []
      responses:
        '200':
          description: Parsed OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Spec missing or parser unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/social-automation/rpa-admin/login:
    post:
      tags: [RPA Admin]
      summary: RPA Admin login (SEO-OPS email/password)
      operationId: rpaAdminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpaAdminLoginSuccess'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: e.g. role_staff_forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/social-automation/rpa-admin/session:
    get:
      tags: [RPA Admin]
      summary: Current RPA Admin session
      operationId: rpaAdminSession
      security:
        - RpaAdminBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpaAdminSessionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/social-automation/rpa-admin/logout:
    post:
      tags: [RPA Admin]
      summary: Revoke RPA Admin session token
      operationId: rpaAdminLogout
      security:
        - RpaAdminBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/social-automation/rpa-admin/scripts:
    get:
      tags: [RPA Admin]
      summary: Script catalog
      operationId: rpaAdminScriptsCatalog
      security:
        - RpaAdminBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkTrue'
                  - type: object
                    properties:
                      scripts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true

  /api/v1/social-automation/rpa-admin/scripts/sync/plan:
    post:
      tags: [RPA Admin]
      summary: Plan script sync from local script inventory
      operationId: rpaAdminScriptsSyncPlan
      security:
        - RpaAdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptSyncPlanRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
