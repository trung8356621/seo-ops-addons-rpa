# CP9B — proposed Nginx change for seo-ops.duckdns.org
# Host file today: /www/server/panel/vhost/nginx/221.132.16.15.conf
# Rewrite today:   /www/server/panel/vhost/rewrite/221.132.16.15.conf
#
# DO NOT apply in this checkpoint. Paste into the SSL server { } block
# (listen 443) BEFORE the generic `location /` rewrite include is enough
# for exact `=` matches (nginx chooses `=` over prefix `/`).
#
# Intent:
# 1) Five UI shells always hit Laravel (Staff Session → SPA HTML / 503).
# 2) /build-rpa-web/* serves hashed static assets only.
# 3) Direct /build-rpa-web/index.html is denied (auth must go through Laravel).
# 4) /social-automation/api/*, /script-media/*, /social-automation-panel/*,
#    /seo, /admin, /login remain unchanged.

# --- BEGIN CP9B ---

# Deny unauthenticated shell HTML at the asset prefix.
location = /build-rpa-web/index.html {
    return 404;
}

# Static React assets (JS/CSS/media under /build-rpa-web/).
location ^~ /build-rpa-web/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# Exact SPA shells → Laravel front controller (Staff Session auth).
location = /social-automation/action-tags {
    rewrite ^ /index.php?$query_string last;
}
location = /social-automation/scripts {
    rewrite ^ /index.php?$query_string last;
}
location = /social-automation/accounts {
    rewrite ^ /index.php?$query_string last;
}
location = /social-automation/clients {
    rewrite ^ /index.php?$query_string last;
}
location = /social-automation/client-api-keys {
    rewrite ^ /index.php?$query_string last;
}

# --- END CP9B ---

